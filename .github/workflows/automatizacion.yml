name: Automatización Tigo con Parámetros

on:
  workflow_dispatch:
    inputs:
      cant_samsung:
        description: 'Cantidad de registros para Samsung'
        required: true
        default: '8000'
      cant_generico:
        description: 'Cantidad de registros para Genérico'
        required: true
        default: '20000'
      grupo_samsung:
        description: 'Nombre de grupo para Samsung (ej. ventaft_samsung)'
        required: true
        default: 'ventaft_samsung'
      grupo_generico:
        description: 'Nombre de grupo para Genérico (ej. ventaft_generico)'
        required: true
        default: 'ventaft_generico'

permissions:
  contents: write

jobs:
  procesar:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar repositorio y archivos LFS
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar Script 1 (Segmentación y Memoria)
      run: |
        python -c "
        cant_s = '${{ inputs.cant_samsung }}'
        cant_g = '${{ inputs.cant_generico }}'
        with open('inputs.txt', 'w') as f:
            f.write(f'{cant_s}\n{cant_g}\n')
        "
        python script1.py < inputs.txt

    - name: Ejecutar Script 2 (Formateo Final)
      run: |
        python -c "
        grupo_s = '${{ inputs.grupo_samsung }}'
        grupo_g = '${{ inputs.grupo_generico }}'
        with open('inputs_s2.txt', 'w') as f:
            f.write(f'{grupo_s}\n{grupo_g}\n')
        "
        python script2.py < inputs_s2.txt

    - name: Configurar Rclone y Subir a Google Drive
      env:
        GDRIVE_TOKEN: ${{ secrets.RCLONE_CONFIG_GDRIVE_TOKEN }}
        FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      run: |
        sudo apt-get update && sudo apt-get install -y rclone

        mkdir -p ~/.config/rclone
        printf '[gdrive]\ntype = drive\nscope = drive\ntoken = %s\n' "$GDRIVE_TOKEN" > ~/.config/rclone/rclone.conf

        # Subida limpia a tu carpeta propia
        rclone copy co_mobile_ft_vac_samsung_final.csv gdrive: --drive-root-folder-id "$FOLDER_ID" -v
        rclone copy co_mobile_ft_vac_generico_final.csv gdrive: --drive-root-folder-id "$FOLDER_ID" -v