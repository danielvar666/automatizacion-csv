name: Procesamiento Automatizado CSV

on:
  workflow_dispatch:
    inputs:
      cantidad_samsung:
        description: 'Cantidad de registros Samsung'
        required: true
        default: '100'
      filtro_grupo_samsung:
        description: 'Filtro de grupo Samsung'
        required: true
        default: 'ingrese'
      cantidad_generico:
        description: 'Cantidad de registros Genérico'
        required: true
        default: '100'
      filtro_grupo_generico:
        description: 'Filtro de grupo Genérico'
        required: true
        default: 'ingrese'
      usuario_id:
        description: 'ID del operador'
        required: false
        default: 'MANUAL_GH'
      usuario_nombre:
        description: 'Nombre del operador'
        required: false
        default: 'Ejecución Manual GitHub'

permissions:
  contents: write

jobs:
  procesar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio y archivos LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Leer índices iniciales antes de procesar
        id: indices_ini
        run: python -c 'import json; d=json.load(open("estado.json")); print(f"ini_sam={d.get(\"inicio_samsung\", 0)}"); print(f"ini_gen={d.get(\"inicio_generico\", 0)}")' >> $GITHUB_OUTPUT

      - name: Ejecutar extracción y limpieza (script1.py)
        run: |
          python script1.py "${{ github.event.inputs.cantidad_samsung }}" "${{ github.event.inputs.filtro_grupo_samsung }}" "${{ github.event.inputs.cantidad_generico }}" "${{ github.event.inputs.filtro_grupo_generico }}"

      - name: Ejecutar post-procesamiento (script2.py)
        run: |
          python script2.py

      - name: Configurar Rclone
        run: |
          sudo apt-get update && sudo apt-get install -y rclone
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONF }}" > ~/.config/rclone/rclone.conf

      - name: Subir archivos finales a Google Drive
        run: |
          rclone copy co_mobile_ft_vac_samsung_final.csv gdrive:
          rclone copy co_mobile_ft_vac_generico_final.csv gdrive:

      - name: Guardar nuevo estado en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado.json
          git diff --staged --quiet || git commit -m "chore: actualizar indices en estado.json [skip ci]"
          git push

      - name: Registrar auditoría en Google Sheets (Éxito)
        if: success()
        env:
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          python auditoria.py "${{ github.event.inputs.usuario_id }}" "${{ github.event.inputs.usuario_nombre }}" "${{ steps.indices_ini.outputs.ini_sam }}" "${{ github.event.inputs.cantidad_samsung }}" "${{ github.event.inputs.filtro_grupo_samsung }}" "${{ steps.indices_ini.outputs.ini_gen }}" "${{ github.event.inputs.cantidad_generico }}" "${{ github.event.inputs.filtro_grupo_generico }}" "Exitoso"

      - name: Registrar auditoría en Google Sheets (Fallo)
        if: failure()
        env:
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          python auditoria.py "${{ github.event.inputs.usuario_id }}" "${{ github.event.inputs.usuario_nombre }}" "${{ steps.indices_ini.outputs.ini_sam }}" "${{ github.event.inputs.cantidad_samsung }}" "${{ github.event.inputs.filtro_grupo_samsung }}" "${{ steps.indices_ini.outputs.ini_gen }}" "${{ github.event.inputs.cantidad_generico }}" "${{ github.event.inputs.filtro_grupo_generico }}" "Fallido"