name: Automatización Tigo con Parámetros

on:
  workflow_dispatch:
    inputs:
      cantidad_samsung:
        description: 'Cantidad de registros Samsung'
        required: true
        default: '100'
        type: string
      filtro_grupo_samsung:
        description: 'Filtro de grupo para Samsung'
        required: true
        default: 'ingrese'
        type: string
      cantidad_generico:
        description: 'Cantidad de registros Genérico'
        required: true
        default: '100'
        type: string
      filtro_grupo_generico:
        description: 'Filtro de grupo para Genérico'
        required: true
        default: 'ingrese'
        type: string

permissions:
  contents: write

jobs:
  procesar:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar repositorio y archivos LFS
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar Script 1 (Segmentación y Memoria)
      run: |
        printf "%s\n%s\n" "${{ inputs.cantidad_samsung }}" "${{ inputs.cantidad_generico }}" > inputs.txt
        python script1.py < inputs.txt

    - name: Ejecutar Script 2 (Formateo Final)
      run: |
        printf "%s\n%s\n" "${{ inputs.filtro_grupo_samsung }}" "${{ inputs.filtro_grupo_generico }}" > inputs_s2.txt
        python script2.py < inputs_s2.txt

    - name: Configurar Rclone y Subir a Google Drive
      env:
        GDRIVE_TOKEN: ${{ secrets.RCLONE_CONFIG_GDRIVE_TOKEN }}
        FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      run: |
        sudo apt-get update && sudo apt-get install -y rclone

        mkdir -p ~/.config/rclone
        printf '[gdrive]\ntype = drive\nscope = drive\ntoken = %s\n' "$GDRIVE_TOKEN" > ~/.config/rclone/rclone.conf

        rclone copy co_mobile_ft_vac_samsung_final.csv gdrive: --drive-root-folder-id "$FOLDER_ID" -v
        rclone copy co_mobile_ft_vac_generico_final.csv gdrive: --drive-root-folder-id "$FOLDER_ID" -v